services:
  - type: web
    name: agrifrance-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://agrifrance.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: agrifrance-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 7

databases:
  - name: agrifrance-postgres
    plan: free
    postgresMajorVersion: "18"
    databaseName: agrifrance
    user: agrifrance
    ipAllowList: []
